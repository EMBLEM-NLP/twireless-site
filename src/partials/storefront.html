<svg class="storefront is-pending" viewBox="0 0 560 450" role="img" aria-labelledby="storefront-title">
  <title id="storefront-title">Illustration of the T Wireless storefront</title>
  <defs>
    <pattern id="sf-brick" width="44" height="22" patternUnits="userSpaceOnUse">
      <rect width="44" height="22" fill="#f3f5f8"/>
      <path d="M0 11h44M0 22h44M22 0v11M0 11v11M44 11v11" fill="none" stroke="#e2e7ee" stroke-width="2"/>
    </pattern>
    <pattern id="sf-stripes" width="48" height="40" patternUnits="userSpaceOnUse">
      <rect width="24" height="40" fill="#ffffff" fill-opacity=".09"/>
    </pattern>
    <linearGradient id="sf-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f0fa"/>
      <stop offset="1" stop-color="#c3d8ee"/>
    </linearGradient>
    <linearGradient id="sf-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3d55"/>
      <stop offset="1" stop-color="#18263a"/>
    </linearGradient>
    <linearGradient id="sf-screen-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9be0"/>
      <stop offset="1" stop-color="#004b87"/>
    </linearGradient>
    <linearGradient id="sf-screen-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a95"/>
      <stop offset="1" stop-color="#e53245"/>
    </linearGradient>
    <linearGradient id="sf-screen-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e7f5"/>
      <stop offset="1" stop-color="#8fb5dc"/>
    </linearGradient>
    <filter id="sf-glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="280" cy="438" rx="262" ry="10" fill="#001626" fill-opacity=".4"/>
  <rect x="20" y="26" width="520" height="406" rx="6" fill="url(#sf-brick)"/>
  <rect x="12" y="16" width="536" height="18" rx="5" fill="#cfd8e3"/>

  <rect x="46" y="46" width="468" height="80" rx="9" fill="#ffffff" stroke="#d3dbe5" stroke-width="2"/>
  <image href="{{ root }}assets/img/t-wireless-logo-960.png" x="70" y="60" width="420" height="52" preserveAspectRatio="xMidYMid meet"/>

  <g class="storefront__awning">
    <rect x="40" y="136" width="480" height="32" fill="#004b87"/>
    <rect x="40" y="136" width="480" height="32" fill="url(#sf-stripes)"/>
    <rect x="40" y="136" width="480" height="5" fill="#e53245"/>
    <path d="M40 166h480v4a12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0 12 12 0 0 1-24 0z" fill="#004b87"/>
  </g>

  <rect x="56" y="198" width="304" height="208" rx="4" fill="url(#sf-glass)" stroke="#97a7b9" stroke-width="7"/>
  <rect x="74" y="322" width="268" height="9" rx="3" fill="#a9bbcf"/>
  <g>
    <rect x="88" y="244" width="42" height="78" rx="8" fill="#2f3033"/>
    <rect x="92" y="252" width="34" height="60" rx="3" fill="url(#sf-screen-1)"/>
    <rect x="144" y="236" width="46" height="86" rx="9" fill="#2f3033"/>
    <rect x="148" y="245" width="38" height="66" rx="3" fill="url(#sf-screen-2)"/>
    <rect x="204" y="250" width="40" height="72" rx="8" fill="#2f3033"/>
    <rect x="208" y="258" width="32" height="55" rx="3" fill="url(#sf-screen-3)"/>
    <rect x="258" y="262" width="70" height="60" rx="7" fill="#2f3033"/>
    <rect x="263" y="267" width="60" height="50" rx="3" fill="url(#sf-screen-1)"/>
  </g>
  <path d="M76 400 150 206M104 400 178 206" stroke="#ffffff" stroke-opacity=".45" stroke-width="9"/>
  <g class="storefront__neon">
    <rect x="232" y="212" width="108" height="44" rx="10" fill="#14233a" stroke="#ff6b78" stroke-width="3" filter="url(#sf-glow)"/>
    <text x="286" y="243" text-anchor="middle" class="storefront__neon-text" filter="url(#sf-glow)">Open</text>
  </g>

  <rect x="384" y="198" width="124" height="234" rx="4" fill="url(#sf-door)" stroke="#97a7b9" stroke-width="7"/>
  <text x="446" y="252" text-anchor="middle" class="storefront__decal storefront__decal--big">We fix</text>
  <text x="446" y="272" text-anchor="middle" class="storefront__decal">phones &amp; tablets</text>
  <rect x="396" y="300" width="7" height="44" rx="3.5" fill="#c9d3de"/>
  <rect x="0" y="432" width="560" height="18" fill="#dfe6ee"/>
</svg>
