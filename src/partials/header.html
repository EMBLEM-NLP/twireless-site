<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header {{ page.header_class }}">
  <div class="sign">
    <div class="sign__inner">
      <a class="sign__logo" href="{{ root }}index.html">
        <picture>
          <source type="image/webp" srcset="{{ root }}assets/img/t-wireless-logo-480.webp 480w, {{ root }}assets/img/t-wireless-logo-960.webp 960w" sizes="{{ page.logo_sizes }}">
          <img src="{{ root }}assets/img/t-wireless-logo-480.png" srcset="{{ root }}assets/img/t-wireless-logo-480.png 480w, {{ root }}assets/img/t-wireless-logo-960.png 960w" sizes="{{ page.logo_sizes }}" width="480" height="55" alt="T Wireless home">
        </picture>
      </a>
      <p class="sign__tag"><strong>Bell Authorised Retailer</strong> in Brampton</p>
      <a class="btn btn--primary btn--small sign__call" href="tel:{{ store.phone_e164 }}">
        <svg class="icon" aria-hidden="true"><use href="#i-call"></use></svg>
        Call {{ store.phone_display }}
      </a>
    </div>
    <nav class="site-nav" aria-label="Main">
      {{{ nav }}}
    </nav>
  </div>
  <div class="awning" aria-hidden="true"></div>
</header>
