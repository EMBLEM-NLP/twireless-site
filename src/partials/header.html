<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header {{ page.header_class }}" data-menu>
  <div class="sign">
    <div class="sign__inner">
      <a class="sign__brand" href="{{ root }}index.html">
        <picture>
          <source type="image/webp" srcset="{{ root }}assets/img/t-wireless-logo-480.webp 480w, {{ root }}assets/img/t-wireless-logo-960.webp 960w" sizes="{{ page.logo_sizes }}">
          <img src="{{ root }}assets/img/t-wireless-logo-480.png" srcset="{{ root }}assets/img/t-wireless-logo-480.png 480w, {{ root }}assets/img/t-wireless-logo-960.png 960w" sizes="{{ page.logo_sizes }}" width="480" height="55" alt="T Wireless">
        </picture>
        <span class="sign__tag"><strong>Bell Authorised Retailer</strong><span class="sign__tag-more"> in Brampton</span></span>
      </a>
      <button class="btn btn--ghost btn--small menu-btn" type="button" aria-expanded="false" aria-controls="site-menu" data-menu-toggle><span class="menu-icon" aria-hidden="true"></span>Menu</button>
      <a class="btn btn--primary btn--small sign__call" href="tel:{{ store.phone_e164 }}">
        <svg class="icon" aria-hidden="true"><use href="#i-call"></use></svg>
        Call {{ store.phone_display }}
      </a>
    </div>
    <div class="menu" id="site-menu">
      <nav class="site-nav" aria-label="Main">
        {{{ nav }}}
      </nav>
      <div class="menu__foot">
        <a class="btn btn--light" href="tel:{{ store.phone_e164 }}">
          <svg class="icon" aria-hidden="true"><use href="#i-call"></use></svg>
          Call {{ store.phone_display }}
        </a>
      </div>
    </div>
  </div>
</header>
<div class="awning" aria-hidden="true"></div>
