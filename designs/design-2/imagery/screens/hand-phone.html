<!doctype html>
<!-- What the phone in the hero photo shows. Rendered by rsi/imagery.py and placed on the screen.
     Logos sit on the white screen with clear space around them, unaltered. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone screen</title>
<style>
@font-face {
  font-family: "Atkinson Hyperlegible Next";
  src: url("/designs/design-2/assets/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2") format("woff2");
  font-weight: 200 800;
}
html, body { margin: 0; height: 100%; }
body {
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 120px 40px 92px;
  background: #ffffff; color: #10233f; text-align: center;
  font-family: "Atkinson Hyperlegible Next", sans-serif;
}
.top { width: 100%; }
.logo { display: block; width: 100%; height: auto; }
.tag { margin: 30px 0 0; font-size: 40px; font-weight: 800; line-height: 1.15; color: #00549a; }
.place { margin: 8px 0 0; font-size: 31px; }
.from { margin: 0 0 30px; font-size: 27px; color: #45566e; }
.carriers { display: grid; gap: 48px; justify-items: center; }
.carriers img { display: block; height: 92px; width: auto; }
.carriers .vp { height: 114px; }
.addr { margin: 0; font-size: 29px; line-height: 1.45; }
.addr strong { font-weight: 800; }
</style>
</head>
<body>
  <div class="top">
    <img class="logo" src="/src/assets/img/t-wireless-logo-960.png" alt="">
    <p class="tag">Bell Authorised Retailer</p>
    <p class="place">in Brampton</p>
  </div>
  <div>
    <p class="from">Plans from</p>
    <div class="carriers">
      <img src="/src/assets/img/brands/bell.svg" alt="">
      <img class="vp" src="/src/assets/img/brands/virgin-plus.png" alt="">
      <img src="/src/assets/img/brands/lucky-mobile.svg" alt="">
    </div>
  </div>
  <p class="addr"><strong>965 Bovaird Dr W</strong><br>647-707-1093</p>
</body>
</html>
